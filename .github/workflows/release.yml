name: Release

# Push a tag like v2.1.0 (see RELEASING.md) to test and publish a GitHub release,
# or run it by hand (Actions → Release → Run workflow) with the version that is
# on main: it then tests main, creates the tag at that commit and publishes.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version on main to release, e.g. 2.14.0 (package.json must match)'
        required: true

permissions:
  contents: write

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  release:
    needs: test
    runs-on: ubuntu-latest
    env:
      # The tag being released: pushed (refs/tags/vX.Y.Z) or asked for by hand.
      TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Check versions agree with the tag
        run: |
          tag="${TAG#v}"
          pkg=$(node -p "require('./package.json').version")
          py=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' sdk/python/crosstalk.py)
          echo "tag=$tag package.json=$pkg python=$py"
          test "$tag" = "$pkg" || { echo "::error::package.json is $pkg, tag is $tag"; exit 1; }
          test "$tag" = "$py"  || { echo "::error::sdk/python __version__ is $py, tag is $tag"; exit 1; }

      - name: Extract release notes from CHANGELOG.md
        run: |
          tag="${TAG#v}"
          awk -v v="$tag" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/        { exit }
            on && /^\[[^]]+\]: /  { exit }
            on                    { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no section for $tag"; exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # A prebuilt package, so installing never compiles TypeScript:
      # npm install -g https://github.com/ajokhai/cross-talk/releases/latest/download/cross-talk.tgz
      - name: Build the installable package
        run: |
          npm ci
          npm pack
          mv cross-talk-*.tgz cross-talk.tgz

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            # Run by hand: create the tag at the commit that was just tested.
            gh release create "$TAG" cross-talk.tgz --title "CrossTalk $TAG" --notes-file notes.md --target "$GITHUB_SHA" $prerelease
          else
            gh release create "$TAG" cross-talk.tgz --title "CrossTalk $TAG" --notes-file notes.md --verify-tag $prerelease
          fi
