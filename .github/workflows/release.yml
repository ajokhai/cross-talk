name: Release

# Push a tag like v2.1.0 (see RELEASING.md) to test and publish a GitHub release.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check versions agree with the tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          py=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' sdk/python/crosstalk.py)
          echo "tag=$tag package.json=$pkg python=$py"
          test "$tag" = "$pkg" || { echo "::error::package.json is $pkg, tag is $tag"; exit 1; }
          test "$tag" = "$py"  || { echo "::error::sdk/python __version__ is $py, tag is $tag"; exit 1; }

      - name: Extract release notes from CHANGELOG.md
        run: |
          tag="${GITHUB_REF_NAME#v}"
          awk -v v="$tag" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/        { exit }
            on && /^\[[^]]+\]: /  { exit }
            on                    { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no section for $tag"; exit 1
          fi

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" --title "CrossTalk $GITHUB_REF_NAME" --notes-file notes.md --verify-tag $prerelease
